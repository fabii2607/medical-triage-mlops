[project]
name = "medical-triage-mlops-main"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "ipykernel>=7.3.0",
    "joblib>=1.5.3",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "numpy>=2.4.6",
    "onnx>=1.22.0",
    "onnxruntime>=1.28.0",
    "pandas>=3.0.5",
    "prometheus-client>=0.26.0",
    "pydantic>=2.13.4",
    "pyyaml>=6,<7",
    "scikit-learn>=1.9.0",
    "skl2onnx>=1.20.0",
    "torch>=2.13.0",
    "transformers>=5.14.1",
    "uvicorn[standard]>=0.52.0",
]

[dependency-groups]
dev = [
    "dvc[gs]>=3.67.1,<4",
    "httpx>=0.28.1",
    "httpx2>=2.12,<3",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

# ── Ruff ────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 88
src = ["."]
include = ["*.py"]
extend-exclude = [
    "agents",
    "data",
    "docs",
    "models",
    "notebooks",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "BLE",  # flake8-blind-except
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "PT",   # flake8-pytest-style
    "RUF",  # Ruff-specific rules
]
ignore = [
    "E501",  # Line length handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = [
    "api",
    "src",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# ── Pytest ────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"
filterwarnings = [
    "default::DeprecationWarning",
    "default::PendingDeprecationWarning",
]
