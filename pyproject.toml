[project]
name = "medical-triage-mlops-main"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "ipykernel>=7.3.0",
    "joblib>=1.5.3",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "numpy>=2.4.6",
    "onnx>=1.22.0",
    "onnxruntime>=1.28.0",
    "pandas>=3.0.5",
    "prometheus-client>=0.26.0",
    "pydantic>=2.13.4",
    "scikit-learn>=1.9.0",
    "skl2onnx>=1.20.0",
    "torch>=2.13.0",
    "transformers>=5.14.1",
    "uvicorn[standard]>=0.52.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]
