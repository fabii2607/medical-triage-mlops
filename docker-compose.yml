services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medical-triage-api
    ports:
      - "8000:8000"

  prometheus:
    image: prom/prometheus:latest
    container_name: medical-triage-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api

  grafana:
    image: grafana/grafana:latest
    container_name: medical-triage-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  grafana_data: