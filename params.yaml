labeling:
  model_name: Yuvrajxms09/biobert-triage-classifier
  confidence_threshold: 0.70
  max_length: 512
  batch_size: 32
  random_state: 42

split:
  random_state: 42
  train_size: 0.70
  validation_size: 0.15
  test_size: 0.15

train:
  tfidf:
    ngram_range:
      - 1
      - 2
    min_df: 2
    max_df: 0.95
    max_features: 5000
    stop_words: english
    sublinear_tf: true

  mlp:
    hidden_layer_sizes:
      - 64
    activation: relu
    solver: adam
    alpha: 0.0001
    learning_rate_init: 0.001
    max_iter: 200
    early_stopping: true
    validation_fraction: 0.15
    n_iter_no_change: 12
    random_state: 42

  logistic_regression:
    C: 1.0
    class_weight: balanced
    max_iter: 2000
    solver: lbfgs
    random_state: 42

evaluate:
  latency_samples: 200

quality_gate:
  enabled: true
  min_validation_macro_f1: 0.70
  min_validation_urgent_recall: 0.70
