name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, format and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.6"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --extra api

      - name: Validate DVC pipeline
        run: uv run --no-sync dvc dag

      - name: Run lint
        run: uv run --no-sync ruff check .

      - name: Check formatting
        run: uv run --no-sync ruff format --check .

      - name: Run tests
        run: uv run --no-sync pytest

  airflow:
    name: Airflow DAG validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AIRFLOW_HOME: /tmp/airflow
      UV_PROJECT_ENVIRONMENT: .venv-airflow

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.6"
          enable-cache: true

      - name: Install Airflow dependencies
        run: uv sync --locked --no-default-groups --group airflow

      - name: Verify Airflow installation
        run: uv run --no-sync airflow version

      - name: Test Airflow DAG
        run: uv run --no-sync pytest tests/test_dag.py

      - name: Validate Airflow Compose
        env:
          # O CI apenas valida o Compose; nenhuma credencial é montada ou usada.
          GOOGLE_APPLICATION_CREDENTIALS_HOST: /tmp/adc-placeholder.json
        run: docker compose -f docker-compose.airflow.yml config --quiet

      - name: Build Airflow image
        run: docker build -f Dockerfile.airflow -t medical-triage-airflow:ci .

  docker:
    name: Docker build (API)
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Sem credenciais GCP o CI não tem o artefato do DVC; este job valida a
      # imagem de serving (dependências + código). O modelo real entra via
      # `dvc pull` no fluxo de deploy.
      - name: Build serving image
        run: docker build -t medical-triage-api:ci .
